services:
  sentinel:
    build: .
    image: dev-ops-sentinel:latest
    container_name: dev-ops-sentinel
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      SENTINEL_DB_PATH: /data/sentinel.db
    volumes:
      - ./data:/data
      - ${SENTINEL_BACKUP_DIR:-./backups}:/backups/postgresql:ro   # hygiene 备份新鲜度;指向你的 pg_dump 目录
    ports:
      - "127.0.0.1:8765:8000"   # 本机/SSH 隧道访问；Kuma 可走容器网络
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    # egress=出网/可达反代的网络;metrics=prometheus/loki 所在网络。
    # 在 .env 设 SENTINEL_EGRESS_NETWORK / SENTINEL_METRICS_NETWORK 指向你已有的
    # docker 网络名(docker network ls 查看);两者可以是同一个网络。
    networks:
      - egress
      - metrics

networks:
  egress:
    external: true
    name: ${SENTINEL_EGRESS_NETWORK:-sentinel-egress}
  metrics:
    external: true
    name: ${SENTINEL_METRICS_NETWORK:-sentinel-metrics}
