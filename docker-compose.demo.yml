# WatchMend 全栈 demo:一条命令体验完整链路(探针 + 指标/日志扫描 + 飞书卡片)。
# 自带 prometheus/loki/node-exporter/cadvisor 和一个被监控的示例服务,零外部依赖。
#
#   cp .env.example .env   # 只需填 FEISHU_VENDOR_WEBHOOK(建个测试群机器人,30 秒)
#   docker compose -f docker-compose.demo.yml up -d --build
#
# 起来后:curl http://127.0.0.1:8765/health 验活;
# 看告警卡:docker compose -f docker-compose.demo.yml stop demo-app,约 15 分钟后出卡;
# 心跳卡/体检日报每天 09:00(北京时间)发,当天 09:00 已过则启动 1 分钟内补发心跳。
# 说明:demo 未接日志采集器,Loki 为空属正常——log_scan 层空跑只演示接线,不产日志告警。
# 可选:在 .env 同时填 LLM_BASE_URL/LLM_API_KEY/LLM_MODEL 可体验事件诊断卡与日报 AI 总结
# (demo 栈没挂 docker socket,SENTINEL_DOCKER_SOCKET 保持留空)。
services:
  sentinel:
    build: .
    image: watchmend:demo
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      SENTINEL_DB_PATH: /data/sentinel.db
      SENTINEL_PROMETHEUS_URL: http://prometheus:9090
      SENTINEL_LOKI_URL: http://loki:3100
    volumes:
      - ./demo/data:/data
      - ./demo/services.demo.yaml:/app/services.yaml:ro
    ports:
      - "127.0.0.1:8765:8000"
    depends_on:
      - prometheus
      - loki
      - demo-app
    networks: [demo]

  # 被监控的示例服务:探针每 5 分钟打它的 /
  demo-app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [demo]

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [demo]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    # 必须挂宿主根:容器自身的 / 是 overlay,被 node-exporter 默认 fs-types 排除,
    # 不挂的话 node_filesystem_*{mountpoint="/"} 为空 → 磁盘查询被误判 exporter 静默
    command:
      - "--path.rootfs=/rootfs"
    volumes:
      - /:/rootfs:ro,rslave
    networks: [demo]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1  # v0.55+:Docker 29(API 1.44 起)旧版 docker factory 注册失败,容器指标全空
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [demo]

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    networks: [demo]

networks:
  demo:
