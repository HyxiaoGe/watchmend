name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Leak check
        run: bash scripts/leak_check.sh

  # demo 栈冒烟:假 webhook 起整套 compose,验证容器能起、/health 200、不陷入 crash-loop。
  # 卡片发送对不可达 webhook 是 best-effort,不应影响存活。
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create dummy .env
        run: |
          cp .env.example .env
          # .env.example now ships every channel empty; set a dummy Feishu webhook so the
          # demo stack satisfies the any-channel startup gate and boots. Delivery 404s are
          # fine — this smoke test only checks /health readiness and the crash-loop count.
          sed -i 's|^FEISHU_VENDOR_WEBHOOK=$|FEISHU_VENDOR_WEBHOOK=https://open.feishu.cn/open-apis/bot/v2/hook/smoke-test-not-real|' .env

      - name: Start demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1; then
              echo "health OK after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::sentinel /health never became ready"
          exit 1

      - name: Verify no crash loop
        run: |
          sleep 30
          curl -fsS http://127.0.0.1:8765/health > /dev/null
          cid=$(docker compose -f docker-compose.demo.yml ps -q sentinel)
          restarts=$(docker inspect --format '{{.RestartCount}}' "$cid")
          echo "sentinel restart count: $restarts"
          [ "$restarts" -eq 0 ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs sentinel

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
