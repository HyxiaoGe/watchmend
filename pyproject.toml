[project]
name = "watchmend"
version = "0.17.0"
description = "AI-assisted operations sentinel with deterministic alerts, read-only diagnosis, and an auditable incident panel"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "jinja2>=3.1",
]

[project.scripts]
watchmend-codex-notify = "sentinel.codex_notify:main"
watchmend-codex-hook = "sentinel.codex_notify:hook_main"

[dependency-groups]
dev = [
    "mcp>=1.4,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "sentinel/_changelog/CHANGELOG.md"
"CHANGELOG.zh-CN.md" = "sentinel/_changelog/CHANGELOG.zh-CN.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
